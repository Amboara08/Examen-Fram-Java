<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Équipes</h1>
      <a class="button" sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/teams/new}"><i class="fa-solid fa-plus"></i> Ajouter une équipe</a>
      <form method="get">
        <label>
          Recherche
          <input name="q" placeholder="Rechercher" th:value="${q}">
        </label>
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="ACTIVE" th:selected="${status == &#x27;ACTIVE&#x27;}">Active</option>
            <option value="INACTIVE" th:selected="${status == &#x27;INACTIVE&#x27;}">Inactive</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="name,asc">Nom</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/teams}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Nom</th>
            <th>Logo (URL)</th>
            <th>Ville</th>
            <th>Entraîneur</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.name}">
              </span>
            </td>
            <td>
              <span th:text="${row.logo}">
              </span>
            </td>
            <td>
              <span th:text="${row.city}">
              </span>
            </td>
            <td>
              <span th:text="${row.coach}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a class="table-action" th:href="@{/teams/{id}(id=${row.id})}"><i class="fa-solid fa-eye"></i> Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/teams(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/teams(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

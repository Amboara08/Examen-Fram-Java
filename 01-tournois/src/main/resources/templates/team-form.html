<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/teams}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Nom
          <input name="name" type="text" required th:value="${record != null ? record.name : null}">
        </label>
        <label>
          Logo (URL)
          <input name="logo" type="text" th:value="${record != null ? record.logo : null}">
        </label>
        <label>
          Ville
          <input name="city" type="text" required th:value="${record != null ? record.city : null}">
        </label>
        <label>
          Entraîneur
          <input name="coach" type="text" required th:value="${record != null ? record.coach : null}">
        </label>
        <input type="hidden" name="players" th:value="${record != null ? record.players : ''}">
        <label>
          Statut
          <select name="status">
            <option value="ACTIVE" th:selected="${record != null and record.status == &#x27;ACTIVE&#x27;}">Active</option>
            <option value="INACTIVE" th:selected="${record != null and record.status == &#x27;INACTIVE&#x27;}">Inactive</option>
          </select>
        </label>
        <button><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
        <a class="button button-secondary" th:href="@{/teams}"><i class="fa-solid fa-xmark"></i> Annuler</a>
      </form>
    </main>
  </body>
</html>

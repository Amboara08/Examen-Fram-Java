<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Matchs 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/matches/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/matches}">Retour</a>
      <table>
        <tr>
          <th>Tournoi</th>
          <td th:text="${record.tournamentId != null ? record.tournamentId : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Domicile</th>
          <td th:text="${homeTeam != null ? homeTeam.name : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Extérieur</th>
          <td th:text="${awayTeam != null ? awayTeam.name : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Date et heure</th>
          <td th:text="${record.scheduledAt != null ? record.scheduledAt : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Terrain</th>
          <td th:text="${record.location != null ? record.location : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Tour</th>
          <td th:text="${record.roundNumber != null ? record.roundNumber : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Position</th>
          <td th:text="${record.position != null ? record.position : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Statut</th>
          <td th:text="${record.status != null ? record.status : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Score domicile</th>
          <td th:text="${record.homeScore != null ? record.homeScore : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Score extérieur</th>
          <td th:text="${record.awayScore != null ? record.awayScore : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Vainqueur</th>
          <td th:text="${record.winnerId == null and record.status == 'TERMINE' ? 'Match nul' : record.winnerId == record.homeTeamId ? homeTeam.name : record.winnerId == record.awayTeamId ? awayTeam.name : '—'}">
          </td>
        </tr>
      </table>
      <div sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)">
        <form class="result-form" th:if="${record.homeTeamId != null and record.awayTeamId != null and tournament.status == &#x27;EN_COURS&#x27;}" method="post" th:action="@{/matches/{id}/actions/result(id=${record.id})}">
          <div class="section-title"><div><h3><i class="fa-solid fa-square-poll-vertical"></i> Enregistrer le résultat</h3><p>Les points du classement seront calculés selon les paramètres du tournoi.</p></div></div>
          <div class="score-grid"><label><span th:text="${homeTeam.name}"></span><input name="homeScore" type="number" min="0" required th:value="${record.homeScore}"></label><span class="score-separator">–</span><label><span th:text="${awayTeam.name}"></span><input name="awayScore" type="number" min="0" required th:value="${record.awayScore}"></label></div>
          <label>Vainqueur<select name="teamId"><option value="">Match nul</option><option th:value="${record.homeTeamId}" th:text="${homeTeam.name}" th:selected="${record.winnerId == record.homeTeamId}"></option><option th:value="${record.awayTeamId}" th:text="${awayTeam.name}" th:selected="${record.winnerId == record.awayTeamId}"></option></select></label>
          <button><i class="fa-solid fa-floppy-disk"></i> Enregistrer le score</button>
        </form>
      </div>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/matches/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/matches}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Tournoi
          <select name="tournamentId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${tournamentIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.tournamentId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Domicile
          <select name="homeTeamId">
            <option value="">Choisir</option>
            <option th:each="choice : ${homeTeamIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.homeTeamId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Extérieur
          <select name="awayTeamId">
            <option value="">Choisir</option>
            <option th:each="choice : ${awayTeamIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.awayTeamId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Date et heure
          <input name="scheduledAt" type="datetime-local" required th:value="${record != null ? record.scheduledAt : null}">
        </label>
        <label>
          Terrain
          <input name="location" type="text" required th:value="${record != null ? record.location : null}">
        </label>
        <label>
          Tour
          <input name="roundNumber" type="number" required min="1" th:value="${record != null ? record.roundNumber : null}">
        </label>
        <label>
          Position
          <input name="position" type="number" required min="1" th:value="${record != null ? record.position : null}">
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/matches}">Annuler</a>
      </form>
    </main>
  </body>
</html>

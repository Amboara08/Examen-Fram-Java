<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Textile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header">
  <strong><i class="fa-solid fa-shirt"></i> Atelier Textile</strong>
  <div><span sec:authentication="name"></span>
    <form method="post" th:action="@{/logout}"><button><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button></form>
  </div>
</header>
<nav th:fragment="nav">
  <a th:href="@{/}"><i class="fa-solid fa-house"></i> Accueil</a>
  <a th:href="@{/clients}"><i class="fa-solid fa-users"></i> Clients</a>
  <a th:href="@{/products}"><i class="fa-solid fa-shirt"></i> Produits</a>
  <a th:href="@{/orders}"><i class="fa-solid fa-bag-shopping"></i> Commandes</a>
  <a th:href="@{/order-lines}"><i class="fa-solid fa-list-check"></i> Lignes de commande</a>
  <a th:href="@{/production-steps}"><i class="fa-solid fa-gears"></i> Étapes</a>
  <a th:href="@{/quality-controls}"><i class="fa-solid fa-clipboard-check"></i> Contrôles qualité</a>
  <a th:href="@{/statistics}"><i class="fa-solid fa-chart-column"></i> Statistiques</a>
  <a sec:authorize="hasRole(&#x27;ADMIN&#x27;)" th:href="@{/settings}"><i class="fa-solid fa-gear"></i> Paramètres</a>
</nav>

<div th:fragment="notices">
  <p class="message" th:if="${success}" th:text="${success}"></p>
  <p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
</div>
<table class="metrics-grid" th:fragment="metrics">
  <tbody><tr th:each="metric : ${stats.metrics}">
    <th th:text="${metric.key}"></th><td th:text="${metric.value}"></td>
  </tr></tbody>
</table>
</body></html>

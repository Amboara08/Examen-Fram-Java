<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="login">
  <div class="login-icon"><i class="fa-solid fa-shirt"></i></div>
  <h1>Atelier Textile</h1>
  <p class="error" th:if="${param.error}">Identifiants incorrects</p>
  <p th:if="${param.logout}">Déconnexion effectuée</p>
  <form method="post" th:action="@{/login}">
    <label>Identifiant<input name="username" autocomplete="username" required></label>
    <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
    <button><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button>
  </form>
</main></body></html>

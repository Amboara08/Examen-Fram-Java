<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/production-steps}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Commande
          <select name="orderId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${orderIdChoices}" th:value="${choice.id}" th:text="${choice.number}" th:selected="${record != null and record.orderId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Étape
          <select name="type">
            <option value="COUPE" th:selected="${record != null and record.type == &#x27;COUPE&#x27;}">Coupe</option>
            <option value="COUTURE" th:selected="${record != null and record.type == &#x27;COUTURE&#x27;}">Couture</option>
            <option value="FINITION" th:selected="${record != null and record.type == &#x27;FINITION&#x27;}">Finition</option>
          </select>
        </label>
        <label>
          Responsable
          <input name="responsible" type="text" required th:value="${record != null ? record.responsible : null}">
        </label>
        <label>
          Début prévu
          <input name="plannedStart" type="datetime-local" required th:value="${record != null ? record.plannedStart : null}">
        </label>
        <label>
          Fin prévue
          <input name="plannedEnd" type="datetime-local" required th:value="${record != null ? record.plannedEnd : null}">
        </label>
        <label>
          Commentaire
          <textarea rows="3" maxlength="2000" name="comment" th:text="${record != null ? record.comment : null}">
          </textarea>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/production-steps}">Annuler</a>
      </form>
    </main>
  </body>
</html>

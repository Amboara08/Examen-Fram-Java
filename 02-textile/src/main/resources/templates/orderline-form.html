<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/order-lines}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Commande
          <select name="orderId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${orderIdChoices}" th:value="${choice.id}" th:text="${choice.number}" th:selected="${record != null and record.orderId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Produit
          <select name="productId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${productIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.productId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Quantité
          <input name="quantity" type="number" required min="1" th:value="${record != null ? record.quantity : null}">
        </label>
        <label>
          Taille
          <input name="size" type="text" required th:value="${record != null ? record.size : null}">
        </label>
        <label>
          Couleur
          <input name="color" type="text" required th:value="${record != null ? record.color : null}">
        </label>
        <label>
          Prix unitaire
          <input name="unitPrice" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.unitPrice : null}">
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/order-lines}">Annuler</a>
      </form>
    </main>
  </body>
</html>

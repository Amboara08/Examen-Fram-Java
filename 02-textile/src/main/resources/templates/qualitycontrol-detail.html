<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Contrôles qualité 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/quality-controls/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/quality-controls}">Retour</a>
      <table>
        <tr>
          <th>Commande</th>
          <td th:text="${record.orderId != null ? record.orderId : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Résultat</th>
          <td th:text="${record.result != null ? record.result : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Responsable</th>
          <td th:text="${record.responsible != null ? record.responsible : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Commentaire</th>
          <td th:text="${record.comment != null ? record.comment : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Date</th>
          <td th:text="${record.checkedAt != null ? record.checkedAt : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/quality-controls/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/orders}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Numéro
          <input name="number" type="text" required th:value="${record != null ? record.number : null}">
        </label>
        <label>
          Client
          <select name="clientId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${clientIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.clientId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Date commande
          <input name="orderDate" type="date" required th:value="${record != null ? record.orderDate : null}">
        </label>
        <label>
          Livraison prévue
          <input name="deliveryDate" type="date" required th:value="${record != null ? record.deliveryDate : null}">
        </label>
        <label>
          Priorité
          <select name="priority">
            <option value="NORMALE" th:selected="${record != null and record.priority == &#x27;NORMALE&#x27;}">Normale</option>
            <option value="URGENTE" th:selected="${record != null and record.priority == &#x27;URGENTE&#x27;}">Urgente</option>
            <option value="TRES_URGENTE" th:selected="${record != null and record.priority == &#x27;TRES_URGENTE&#x27;}">Tres urgente</option>
          </select>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/orders}">Annuler</a>
      </form>
    </main>
  </body>
</html>

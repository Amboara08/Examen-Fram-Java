<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/vehicles}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Immatriculation
          <input name="plate" type="text" required th:value="${record != null ? record.plate : null}">
        </label>
        <label>
          Usager
          <select name="customerId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${customerIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.customerId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Type
          <select name="type">
            <option value="VOITURE" th:selected="${record != null and record.type == &#x27;VOITURE&#x27;}">Voiture</option>
            <option value="MOTO" th:selected="${record != null and record.type == &#x27;MOTO&#x27;}">Moto</option>
            <option value="UTILITAIRE" th:selected="${record != null and record.type == &#x27;UTILITAIRE&#x27;}">Utilitaire</option>
          </select>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/vehicles}">Annuler</a>
      </form>
    </main>
  </body>
</html>

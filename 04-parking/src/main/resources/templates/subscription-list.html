<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Abonnements</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/subscriptions/new}">Ajouter</a>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="ACTIF" th:selected="${status == &#x27;ACTIF&#x27;}">Actif</option>
            <option value="ANNULE" th:selected="${status == &#x27;ANNULE&#x27;}">Annule</option>
          </select>
        </label>
        <label>
          Formule
          <select name="filter">
            <option value="">Tous</option>
            <option value="type:JOURNALIER" th:selected="${filter == &#x27;type:JOURNALIER&#x27;}">Journalier</option>
            <option value="type:HEBDOMADAIRE" th:selected="${filter == &#x27;type:HEBDOMADAIRE&#x27;}">Hebdomadaire</option>
            <option value="type:MENSUEL" th:selected="${filter == &#x27;type:MENSUEL&#x27;}">Mensuel</option>
            <option value="type:ANNUEL" th:selected="${filter == &#x27;type:ANNUEL&#x27;}">Annuel</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="id,asc">Numéro</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/subscriptions}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Usager</th>
            <th>Véhicule</th>
            <th>Formule</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.customerId}">
              </span>
            </td>
            <td>
              <span th:text="${row.vehicleId}">
              </span>
            </td>
            <td>
              <span th:text="${row.type}">
              </span>
            </td>
            <td>
              <span th:text="${row.startDate}">
              </span>
            </td>
            <td>
              <span th:text="${row.endDate}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/subscriptions/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/subscriptions(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/subscriptions(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

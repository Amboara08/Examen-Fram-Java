<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Réservations</h1>
      <a class="button button-primary" sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/reservations/new}"><i class="fa-solid fa-calendar-plus"></i> Ajouter une réservation</a>
      <form method="get">
        <label>
          Usager
          <select name="filter">
            <option value="">Tous</option>
            <option th:each="choice : ${customerIdChoices}" th:value="&#x27;customerId:&#x27; + ${choice.id}" th:selected="${filter == &#x27;customerId:&#x27; + choice.id}" th:text="${choice.name}">
            </option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="id,asc">Numéro</option>
          </select>
        </label>
        <button><i class="fa-solid fa-filter"></i> Filtrer</button>
        <a class="button button-secondary" th:href="@{/reservations}"><i class="fa-solid fa-rotate-left"></i> Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Usager</th>
            <th>Véhicule</th>
            <th>Place (automatique si vide)</th>
            <th>Arrivée prévue</th>
            <th>Départ prévu</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:each="customer : ${customerIdChoices}" th:if="${customer.id == row.customerId}" th:text="${customer.name}"></span>
            </td>
            <td>
              <span th:each="vehicle : ${vehicleIdChoices}" th:if="${vehicle.id == row.vehicleId}" th:text="${vehicle.plate + ' · ' + vehicle.brand + ' ' + vehicle.model}"></span>
            </td>
            <td>
              <span th:text="${row.spaceId}">
              </span>
            </td>
            <td>
              <span th:text="${row.arrival}">
              </span>
            </td>
            <td>
              <span th:text="${row.departure}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a class="button button-view" th:href="@{/reservations/{id}(id=${row.id})}"><i class="fa-solid fa-eye"></i> Voir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/reservations(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/reservations(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

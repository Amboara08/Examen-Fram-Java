<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a class="button button-secondary" th:href="@{/parking/stays}"><i class="fa-solid fa-arrow-left"></i> Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Usager
          <select name="customerId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${customerIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.customerId == choice.id}">
            </option>
          </select>
        </label>
        <p class="form-help"><i class="fa-solid fa-car-side"></i> La voiture associée au client sera sélectionnée automatiquement.</p>
        <label>
          Place (automatique si vide)
          <select name="spaceId">
            <option value="">Choisir</option>
            <option th:each="choice : ${spaceIdChoices}" th:value="${choice.id}" th:text="${choice.number}" th:selected="${record != null and record.spaceId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Réservation
          <select name="reservationId">
            <option value="">Choisir</option>
            <option th:each="choice : ${reservationIdChoices}" th:value="${choice.id}" th:text="${choice.id}" th:selected="${record != null and record.reservationId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Entrée
          <input name="enteredAt" type="datetime-local" required th:value="${record != null ? record.enteredAt : null}">
        </label>
        <label>
          Sortie prévue
          <input name="expectedExit" type="datetime-local" required th:value="${record != null ? record.expectedExit : null}">
        </label>
        <button class="button-success"><i class="fa-solid fa-right-to-bracket"></i> Enregistrer l'entrée</button>
        <a class="button button-secondary" th:href="@{/parking/stays}"><i class="fa-solid fa-xmark"></i> Annuler</a>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/subscriptions}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Usager
          <select name="customerId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${customerIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.customerId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Véhicule
          <select name="vehicleId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${vehicleIdChoices}" th:value="${choice.id}" th:text="${choice.plate}" th:selected="${record != null and record.vehicleId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Formule
          <select name="type">
            <option value="JOURNALIER" th:selected="${record != null and record.type == &#x27;JOURNALIER&#x27;}">Journalier</option>
            <option value="HEBDOMADAIRE" th:selected="${record != null and record.type == &#x27;HEBDOMADAIRE&#x27;}">Hebdomadaire</option>
            <option value="MENSUEL" th:selected="${record != null and record.type == &#x27;MENSUEL&#x27;}">Mensuel</option>
            <option value="ANNUEL" th:selected="${record != null and record.type == &#x27;ANNUEL&#x27;}">Annuel</option>
          </select>
        </label>
        <label>
          Début
          <input name="startDate" type="date" required th:value="${record != null ? record.startDate : null}">
        </label>
        <label>
          Fin
          <input name="endDate" type="date" required th:value="${record != null ? record.endDate : null}">
        </label>
        <label>
          Statut
          <select name="status">
            <option value="ACTIF" th:selected="${record != null and record.status == &#x27;ACTIF&#x27;}">Actif</option>
            <option value="ANNULE" th:selected="${record != null and record.status == &#x27;ANNULE&#x27;}">Annule</option>
          </select>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/subscriptions}">Annuler</a>
      </form>
    </main>
  </body>
</html>

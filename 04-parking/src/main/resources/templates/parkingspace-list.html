<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Places</h1>
      <a class="button button-primary" sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/parking/spaces/new}"><i class="fa-solid fa-plus"></i> Ajouter une place</a>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="LIBRE" th:selected="${status == &#x27;LIBRE&#x27;}">Libre</option>
            <option value="HORS_SERVICE" th:selected="${status == &#x27;HORS_SERVICE&#x27;}">Hors service</option>
            <option value="OCCUPEE" th:selected="${status == &#x27;OCCUPEE&#x27;}">Occupee</option>
            <option value="RESERVEE" th:selected="${status == &#x27;RESERVEE&#x27;}">Reservee</option>
          </select>
        </label>
        <label>
          Type
          <select name="filter">
            <option value="">Tous</option>
            <option value="type:STANDARD" th:selected="${filter == &#x27;type:STANDARD&#x27;}">Standard</option>
            <option value="type:PMR" th:selected="${filter == &#x27;type:PMR&#x27;}">Pmr</option>
            <option value="type:VIP" th:selected="${filter == &#x27;type:VIP&#x27;}">Vip</option>
            <option value="type:ABONNE" th:selected="${filter == &#x27;type:ABONNE&#x27;}">Abonne</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="number,asc">Numéro</option>
          </select>
        </label>
        <button><i class="fa-solid fa-filter"></i> Filtrer</button>
        <a class="button button-secondary" th:href="@{/parking/spaces}"><i class="fa-solid fa-rotate-left"></i> Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Numéro</th>
            <th>Zone</th>
            <th>Type</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.number}">
              </span>
            </td>
            <td>
              <span th:text="${row.zone}">
              </span>
            </td>
            <td>
              <span th:text="${row.type}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a class="button button-view" th:href="@{/parking/spaces/{id}(id=${row.id})}"><i class="fa-solid fa-eye"></i> Voir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/parking/spaces(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/parking/spaces(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Usagers 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a class="button button-primary" sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/users/{id}/edit(id=${record.id})}"><i class="fa-solid fa-pen"></i> Modifier</a>
      <a class="button button-secondary" th:href="@{/users}"><i class="fa-solid fa-arrow-left"></i> Retour</a>
      <table>
        <tr>
          <th>Nom</th>
          <td th:text="${record.name != null ? record.name : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>E-mail</th>
          <td th:text="${record.email != null ? record.email : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Téléphone</th>
          <td th:text="${record.phone != null ? record.phone : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Catégorie</th>
          <td th:text="${record.type != null ? record.type : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2><i class="fa-solid fa-car-side"></i> Voiture associée</h2>
      <table th:if="${vehicle != null}">
        <tr><th>Immatriculation</th><td th:text="${vehicle.plate}"></td></tr>
        <tr><th>Type</th><td th:text="${vehicle.type}"></td></tr>
        <tr><th>Marque</th><td th:text="${vehicle.brand}"></td></tr>
        <tr><th>Modèle</th><td th:text="${vehicle.model}"></td></tr>
      </table>
      <p class="empty-state" th:if="${vehicle == null}"><i class="fa-solid fa-triangle-exclamation"></i> Ce compte ancien ne possède pas encore de voiture. Utilisez Modifier pour la renseigner.</p>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/users/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button class="button-danger"><i class="fa-solid fa-trash"></i> Supprimer</button>
      </form>
    </main>
  </body>
</html>

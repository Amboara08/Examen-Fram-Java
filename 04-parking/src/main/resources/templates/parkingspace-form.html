<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/parking/spaces}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Numéro
          <input name="number" type="text" required th:value="${record != null ? record.number : null}">
        </label>
        <label>
          Zone
          <input name="zone" type="text" required th:value="${record != null ? record.zone : null}">
        </label>
        <label>
          Type
          <select name="type">
            <option value="STANDARD" th:selected="${record != null and record.type == &#x27;STANDARD&#x27;}">Standard</option>
            <option value="PMR" th:selected="${record != null and record.type == &#x27;PMR&#x27;}">Pmr</option>
            <option value="VIP" th:selected="${record != null and record.type == &#x27;VIP&#x27;}">Vip</option>
            <option value="ABONNE" th:selected="${record != null and record.type == &#x27;ABONNE&#x27;}">Abonne</option>
          </select>
        </label>
        <label>
          Statut
          <select name="status">
            <option value="LIBRE" th:selected="${record != null and record.status == &#x27;LIBRE&#x27;}">Libre</option>
            <option value="HORS_SERVICE" th:selected="${record != null and record.status == &#x27;HORS_SERVICE&#x27;}">Hors service</option>
          </select>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/parking/spaces}">Annuler</a>
      </form>
    </main>
  </body>
</html>

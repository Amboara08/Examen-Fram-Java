<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Colis 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/parcels/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/parcels}">Retour</a>
      <table>
        <tr>
          <th>Commande</th>
          <td th:text="${record.orderId != null ? record.orderId : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Référence</th>
          <td th:text="${record.reference != null ? record.reference : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Description</th>
          <td th:text="${record.description != null ? record.description : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Poids (kg)</th>
          <td th:text="${record.weight != null ? record.weight : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Volume</th>
          <td th:text="${record.volume != null ? record.volume : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/parcels/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

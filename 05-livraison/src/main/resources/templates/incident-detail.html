<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Incidents 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/incidents/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/incidents}">Retour</a>
      <table>
        <tr>
          <th>Commande</th>
          <td th:text="${record.orderId != null ? record.orderId : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Type</th>
          <td th:text="${record.type != null ? record.type : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Description</th>
          <td th:text="${record.description != null ? record.description : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Résolution</th>
          <td th:text="${record.resolution != null ? record.resolution : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Livreur</th>
          <td th:text="${record.delivererId != null ? record.delivererId : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Date</th>
          <td th:text="${record.occurredAt != null ? record.occurredAt : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <div sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)">
        <form th:if="${record.resolution == null or record.resolution.isEmpty()}" method="post" th:action="@{/incidents/{id}/actions/resolve(id=${record.id})}">
          <h3>Résoudre</h3>
          <label>
            Commentaire
            <input name="comment" type="text">
          </label>
          <button>Résoudre</button>
        </form>
      </div>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/incidents/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Commandes</h1>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="CREEE" th:selected="${status == &#x27;CREEE&#x27;}">Creee</option>
            <option value="ASSIGNEE" th:selected="${status == &#x27;ASSIGNEE&#x27;}">Assignee</option>
            <option value="PRISE_EN_CHARGE" th:selected="${status == &#x27;PRISE_EN_CHARGE&#x27;}">Prise en charge</option>
            <option value="EN_TRANSIT" th:selected="${status == &#x27;EN_TRANSIT&#x27;}">En transit</option>
            <option value="LIVREE" th:selected="${status == &#x27;LIVREE&#x27;}">Livree</option>
            <option value="ANNULEE" th:selected="${status == &#x27;ANNULEE&#x27;}">Annulee</option>
            <option value="ECHEC_LIVRAISON" th:selected="${status == &#x27;ECHEC_LIVRAISON&#x27;}">Echec livraison</option>
            <option value="RETOURNEE" th:selected="${status == &#x27;RETOURNEE&#x27;}">Retournee</option>
          </select>
        </label>
        <label>
          Priorité
          <select name="filter">
            <option value="">Tous</option>
            <option value="priority:NORMALE" th:selected="${filter == &#x27;priority:NORMALE&#x27;}">Normale</option>
            <option value="priority:URGENTE" th:selected="${filter == &#x27;priority:URGENTE&#x27;}">Urgente</option>
            <option value="priority:TRES_URGENTE" th:selected="${filter == &#x27;priority:TRES_URGENTE&#x27;}">Tres urgente</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="number,asc">Numéro</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/orders}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Numéro</th>
            <th>Client</th>
            <th>Enlèvement</th>
            <th>Livraison</th>
            <th>Poids (kg)</th>
            <th>Volume</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.number}">
              </span>
            </td>
            <td>
              <span th:text="${row.clientId}">
              </span>
            </td>
            <td>
              <span th:text="${row.pickupAddress}">
              </span>
            </td>
            <td>
              <span th:text="${row.deliveryAddress}">
              </span>
            </td>
            <td>
              <span th:text="${row.weight}">
              </span>
            </td>
            <td>
              <span th:text="${row.volume}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/orders/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/orders(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/orders(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

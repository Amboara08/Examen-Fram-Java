<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/proofs}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Commande
          <select name="orderId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${orderIdChoices}" th:value="${choice.id}" th:text="${choice.number}" th:selected="${record != null and record.orderId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Réceptionnaire
          <input name="recipient" type="text" required th:value="${record != null ? record.recipient : null}">
        </label>
        <label>
          Code de confirmation
          <input name="confirmationCode" type="text" required th:value="${record != null ? record.confirmationCode : null}">
        </label>
        <label>
          Commentaire
          <textarea rows="3" maxlength="2000" name="comment" th:text="${record != null ? record.comment : null}">
          </textarea>
        </label>
        <label>
          Date et heure
          <input name="deliveredAt" type="datetime-local" required th:value="${record != null ? record.deliveredAt : null}">
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/proofs}">Annuler</a>
      </form>
    </main>
  </body>
</html>

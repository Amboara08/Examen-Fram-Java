<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/parcels}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Commande
          <select name="orderId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${orderIdChoices}" th:value="${choice.id}" th:text="${choice.number}" th:selected="${record != null and record.orderId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Référence
          <input name="reference" type="text" required th:value="${record != null ? record.reference : null}">
        </label>
        <label>
          Description
          <textarea rows="3" maxlength="2000" name="description" th:text="${record != null ? record.description : null}">
          </textarea>
        </label>
        <label>
          Poids (kg)
          <input name="weight" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.weight : null}">
        </label>
        <label>
          Volume
          <input name="volume" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.volume : null}">
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/parcels}">Annuler</a>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Colis</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/parcels/new}">Ajouter</a>
      <form method="get">
        <label>
          Commande
          <select name="filter">
            <option value="">Tous</option>
            <option th:each="choice : ${orderIdChoices}" th:value="&#x27;orderId:&#x27; + ${choice.id}" th:selected="${filter == &#x27;orderId:&#x27; + choice.id}" th:text="${choice.number}">
            </option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="id,asc">Numéro</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/parcels}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Commande</th>
            <th>Référence</th>
            <th>Description</th>
            <th>Poids (kg)</th>
            <th>Volume</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.orderId}">
              </span>
            </td>
            <td>
              <span th:text="${row.reference}">
              </span>
            </td>
            <td>
              <span th:text="${row.description}">
              </span>
            </td>
            <td>
              <span th:text="${row.weight}">
              </span>
            </td>
            <td>
              <span th:text="${row.volume}">
              </span>
            </td>
            <td>
              <a th:href="@{/parcels/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/parcels(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/parcels(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

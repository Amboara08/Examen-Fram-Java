<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Incidents</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/incidents/new}">Ajouter</a>
      <form method="get">
        <label>
          Type
          <select name="filter">
            <option value="">Tous</option>
            <option value="type:CLIENT_ABSENT" th:selected="${filter == &#x27;type:CLIENT_ABSENT&#x27;}">Client absent</option>
            <option value="type:ADRESSE_INCORRECTE" th:selected="${filter == &#x27;type:ADRESSE_INCORRECTE&#x27;}">Adresse incorrecte</option>
            <option value="type:COLIS_ENDOMMAGE" th:selected="${filter == &#x27;type:COLIS_ENDOMMAGE&#x27;}">Colis endommage</option>
            <option value="type:PANNE" th:selected="${filter == &#x27;type:PANNE&#x27;}">Panne</option>
            <option value="type:REFUS_CLIENT" th:selected="${filter == &#x27;type:REFUS_CLIENT&#x27;}">Refus client</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="id,asc">Numéro</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/incidents}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Commande</th>
            <th>Type</th>
            <th>Description</th>
            <th>Résolution</th>
            <th>Livreur</th>
            <th>Date</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.orderId}">
              </span>
            </td>
            <td>
              <span th:text="${row.type}">
              </span>
            </td>
            <td>
              <span th:text="${row.description}">
              </span>
            </td>
            <td>
              <span th:text="${row.resolution}">
              </span>
            </td>
            <td>
              <span th:text="${row.delivererId}">
              </span>
            </td>
            <td>
              <span th:text="${row.occurredAt}">
              </span>
            </td>
            <td>
              <a th:href="@{/incidents/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/incidents(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/incidents(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

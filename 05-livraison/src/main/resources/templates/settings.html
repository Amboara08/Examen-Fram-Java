<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Paramètres</h1>
      <form method="post" th:action="@{/settings}" th:each="setting : ${settings}">
        <label th:text="${setting.label}">
        </label>
        <input type="hidden" name="name" th:value="${setting.name}">
        <input type="number" step="0.01" min="0" max="1000000" name="value" th:value="${setting.value}" required>
        <button>Enregistrer</button>
      </form>
      <form method="post" th:action="@{/settings/zone}">
        <h2>Tarif par zone</h2>
        <label>
          Zone
          <input name="zone" maxlength="50" pattern="[a-zA-Z0-9.]+" required>
        </label>
        <label>
          Coefficient
          <input name="value" type="number" min="0" max="1000000" step="0.01" required>
        </label>
        <button>Enregistrer</button>
      </form>
    </main>
  </body>
</html>

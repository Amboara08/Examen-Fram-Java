<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Livreurs 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/deliverers/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/deliverers}">Retour</a>
      <table>
        <tr>
          <th>Nom</th>
          <td th:text="${record.name != null ? record.name : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Téléphone</th>
          <td th:text="${record.phone != null ? record.phone : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr><th>E-mail</th><td th:text="${record.email}"></td></tr>
        <tr>
          <th>Véhicule</th>
          <td th:text="${record.vehicle != null ? record.vehicle : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/deliverers/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

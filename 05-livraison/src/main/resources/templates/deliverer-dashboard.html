<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}"></title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="client-portal"><header class="client-header"><a class="client-brand" th:href="@{/livreur}"><i class="fa-solid fa-motorcycle"></i> Espace livreur</a><div><span th:text="${deliverer.name}"></span><form method="post" th:action="@{/logout}"><button><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button></form></div></header>
<main class="client-main"><div th:replace="~{layout :: notices}"></div><section class="client-hero"><div><span>LIVREUR</span><h1 th:text="'Bonjour, '+${deliverer.name}"></h1><p th:text="${deliverer.vehicle}"></p></div></section>
<section class="client-card"><h2><i class="fa-solid fa-bell"></i> Commandes disponibles</h2><div class="responsive-table"><table><thead><tr><th>Suivi</th><th>Enlèvement</th><th>Destination</th><th>Poids</th><th>Priorité</th><th>Action</th></tr></thead><tbody><tr th:each="o:${available}"><td th:text="${o.number}"></td><td th:text="${o.pickupAddress}"></td><td th:text="${o.deliveryAddress}"></td><td th:text="${o.weight+' kg'}"></td><td th:text="${o.priority}"></td><td><form method="post" th:action="@{/livreur/orders/{id}/accept(id=${o.id})}"><button class="button-success"><i class="fa-solid fa-hand"></i> Accepter</button></form></td></tr><tr th:if="${#lists.isEmpty(available)}"><td colspan="6" class="empty-state">Aucune commande disponible</td></tr></tbody></table></div></section>
<section class="client-card"><h2><i class="fa-solid fa-route"></i> Mes livraisons</h2><div class="responsive-table"><table><thead><tr><th>Suivi</th><th>Client</th><th>Destination</th><th>Statut</th><th>Contact</th><th>Action</th></tr></thead><tbody><tr th:each="o:${mine}"><td th:text="${o.number}"></td><td><span th:each="c:${clients}" th:if="${c.id==o.clientId}" th:text="${c.name}"></span></td><td th:text="${o.deliveryAddress}"></td><td><span class="status-badge" th:text="${o.status}"></span></td><td><span th:each="c:${clients}" th:if="${c.id==o.clientId}"><a class="button button-secondary" th:href="${'tel:'+c.phone}"><i class="fa-solid fa-phone"></i> Appeler</a><a class="button button-secondary" th:href="${'mailto:'+c.email}"><i class="fa-solid fa-envelope"></i> E-mail</a></span></td><td>
<form th:if="${o.status=='ASSIGNEE'}" method="post" th:action="@{/livreur/orders/{id}/pickup(id=${o.id})}"><button><i class="fa-solid fa-box"></i> Colis récupéré</button></form>
<form th:if="${o.status=='PRISE_EN_CHARGE'}" method="post" th:action="@{/livreur/orders/{id}/start(id=${o.id})}"><button><i class="fa-solid fa-truck-fast"></i> Démarrer</button></form>
<form th:if="${o.status=='EN_TRANSIT'}" method="post" th:action="@{/livreur/orders/{id}/deliver(id=${o.id})}"><input name="recipient" placeholder="Nom du réceptionnaire" required><input name="confirmationCode" placeholder="Code de confirmation" required><input name="comment" placeholder="Commentaire facultatif"><button class="button-success"><i class="fa-solid fa-circle-check"></i> Confirmer livrée</button></form>
<form th:if="${o.status=='ASSIGNEE' or o.status=='PRISE_EN_CHARGE' or o.status=='EN_TRANSIT'}" method="post" th:action="@{/livreur/orders/{id}/fail(id=${o.id})}"><input name="comment" placeholder="Motif obligatoire" required><button class="button-danger"><i class="fa-solid fa-triangle-exclamation"></i> Déclarer un échec</button></form>
</td></tr><tr th:if="${#lists.isEmpty(mine)}"><td colspan="6" class="empty-state">Aucune livraison acceptée</td></tr></tbody></table></div></section></main></body></html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/drivers}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Nom
          <input name="name" type="text" required th:value="${record != null ? record.name : null}">
        </label>
        <label>
          Téléphone
          <input name="phone" type="text" required th:value="${record != null ? record.phone : null}">
        </label>
        <label>E-mail<input name="email" type="email" required th:value="${record != null ? record.email : null}"></label>
        <label>Mot de passe<input name="password" type="password" minlength="8" th:required="${!editing}" autocomplete="new-password" th:placeholder="${editing ? 'Laisser vide pour conserver' : '8 caractères minimum'}"></label>
        <input name="licenseNumber" type="hidden" th:value="${record != null ? record.licenseNumber : generatedLicense}">
        <input name="licenseExpiry" type="hidden" th:value="${record != null ? record.licenseExpiry : licenseExpiry}">
        <input name="hiredAt" type="hidden" th:value="${record != null ? record.hiredAt : today}">
        <input name="distanceToPickup" type="hidden" value="0"><input name="status" type="hidden" value="DISPONIBLE">
        <h2><i class="fa-solid fa-car-side"></i> Voiture du chauffeur</h2>
        <label>Immatriculation<input name="plate" required th:value="${vehicle != null ? vehicle.plate : null}"></label>
        <label>Marque<input name="brand" required th:value="${vehicle != null ? vehicle.brand : null}"></label>
        <input name="carModel" type="hidden" th:value="${vehicle != null ? vehicle.model : 'Standard'}">
        <input name="year" type="hidden" th:value="${vehicle != null ? vehicle.year : currentYear}">
        <label>Nombre de places<input name="capacity" type="number" min="1" required th:value="${vehicle != null ? vehicle.capacity : null}"></label>
        <button>Enregistrer</button>
        <a th:href="@{/drivers}">Annuler</a>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Courses</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/rides/new}">Ajouter</a>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="EN_ATTENTE" th:selected="${status == &#x27;EN_ATTENTE&#x27;}">En attente</option>
            <option value="ASSIGNEE" th:selected="${status == &#x27;ASSIGNEE&#x27;}">Assignee</option>
            <option value="EN_COURS" th:selected="${status == &#x27;EN_COURS&#x27;}">En cours</option>
            <option value="TERMINEE" th:selected="${status == &#x27;TERMINEE&#x27;}">Terminee</option>
            <option value="ANNULEE" th:selected="${status == &#x27;ANNULEE&#x27;}">Annulee</option>
          </select>
        </label>
        <label>
          Client
          <select name="filter">
            <option value="">Tous</option>
            <option th:each="choice : ${clientIdChoices}" th:value="&#x27;clientId:&#x27; + ${choice.id}" th:selected="${filter == &#x27;clientId:&#x27; + choice.id}" th:text="${choice.name}">
            </option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="scheduledAt,asc">Date et heure</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/rides}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Client</th>
            <th>Départ</th>
            <th>Destination</th>
            <th>Distance (km)</th>
            <th>Date et heure</th>
            <th>Passagers</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.clientId}">
              </span>
            </td>
            <td>
              <span th:text="${row.departure}">
              </span>
            </td>
            <td>
              <span th:text="${row.destination}">
              </span>
            </td>
            <td>
              <span th:text="${row.distance}">
              </span>
            </td>
            <td>
              <span th:text="${row.scheduledAt}">
              </span>
            </td>
            <td>
              <span th:text="${row.passengers}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/rides/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/rides(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/rides(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

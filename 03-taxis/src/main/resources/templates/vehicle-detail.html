<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Véhicules 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/vehicles/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/vehicles}">Retour</a>
      <table>
        <tr>
          <th>Immatriculation</th>
          <td th:text="${record.plate != null ? record.plate : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Marque</th>
          <td th:text="${record.brand != null ? record.brand : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Modèle</th>
          <td th:text="${record.model != null ? record.model : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Année</th>
          <td th:text="${record.year != null ? record.year : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Places</th>
          <td th:text="${record.capacity != null ? record.capacity : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Kilométrage</th>
          <td th:text="${record.mileage != null ? record.mileage : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Statut</th>
          <td th:text="${record.status != null ? record.status : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/vehicles/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

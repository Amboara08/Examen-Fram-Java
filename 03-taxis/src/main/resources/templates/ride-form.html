<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/rides}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Client
          <select name="clientId" required>
            <option value="">Choisir</option>
            <option th:each="choice : ${clientIdChoices}" th:value="${choice.id}" th:text="${choice.name}" th:selected="${record != null and record.clientId == choice.id}">
            </option>
          </select>
        </label>
        <label>
          Départ
          <input name="departure" type="text" required th:value="${record != null ? record.departure : null}">
        </label>
        <label>
          Destination
          <input name="destination" type="text" required th:value="${record != null ? record.destination : null}">
        </label>
        <label>
          Distance (km)
          <input name="distance" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.distance : null}">
        </label>
        <label>
          Date et heure
          <input name="scheduledAt" type="datetime-local" required th:value="${record != null ? record.scheduledAt : null}">
        </label>
        <label>
          Passagers
          <input name="passengers" type="number" required min="1" th:value="${record != null ? record.passengers : null}">
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/rides}">Annuler</a>
      </form>
    </main>
  </body>
</html>

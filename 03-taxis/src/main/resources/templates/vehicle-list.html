<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Véhicules</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/vehicles/new}">Ajouter</a>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="EN_COURSE" th:selected="${status == &#x27;EN_COURSE&#x27;}">En course</option>
            <option value="DISPONIBLE" th:selected="${status == &#x27;DISPONIBLE&#x27;}">Disponible</option>
            <option value="MAINTENANCE" th:selected="${status == &#x27;MAINTENANCE&#x27;}">Maintenance</option>
            <option value="HORS_SERVICE" th:selected="${status == &#x27;HORS_SERVICE&#x27;}">Hors service</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="id,asc">Numéro</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/vehicles}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Immatriculation</th>
            <th>Marque</th>
            <th>Modèle</th>
            <th>Année</th>
            <th>Places</th>
            <th>Kilométrage</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.plate}">
              </span>
            </td>
            <td>
              <span th:text="${row.brand}">
              </span>
            </td>
            <td>
              <span th:text="${row.model}">
              </span>
            </td>
            <td>
              <span th:text="${row.year}">
              </span>
            </td>
            <td>
              <span th:text="${row.capacity}">
              </span>
            </td>
            <td>
              <span th:text="${row.mileage}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/vehicles/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/vehicles(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/vehicles(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>

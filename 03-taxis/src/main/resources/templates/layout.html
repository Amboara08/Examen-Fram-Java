<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Taxis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header">
  <a class="brand-button" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR','USER')" th:href="@{/}"><i class="fa-solid fa-taxi"></i><span>Taxis</span></a>
  <a class="brand-button" sec:authorize="hasRole('CUSTOMER')" th:href="@{/client}"><i class="fa-solid fa-taxi"></i><span>Taxis</span></a>
  <a class="brand-button" sec:authorize="hasRole('DRIVER')" th:href="@{/chauffeur}"><i class="fa-solid fa-taxi"></i><span>Taxis</span></a>
  <div><span sec:authentication="name"></span>
    <form method="post" th:action="@{/logout}"><button><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button></form>
  </div>
</header>
<nav th:fragment="nav">
  <a th:href="@{/}"><i class="fa-solid fa-house"></i> Accueil</a>
  <a th:href="@{/clients}"><i class="fa-solid fa-users"></i> Clients</a>
  <a th:href="@{/drivers}"><i class="fa-solid fa-id-card"></i> Chauffeurs</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/statistics}"><i class="fa-solid fa-chart-column"></i> Statistiques</a>
</nav>

<div th:fragment="notices">
  <p class="message" th:if="${success}" th:text="${success}"></p>
  <p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
</div>
<table th:fragment="metrics">
  <tbody><tr th:each="metric : ${stats.metrics}">
    <th th:text="${metric.key}"></th><td th:text="${metric.value}"></td>
  </tr></tbody>
</table>
</body></html>

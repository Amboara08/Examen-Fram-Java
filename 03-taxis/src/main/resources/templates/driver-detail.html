<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>
        Chauffeurs 
        <span th:text="&#x27;#&#x27; + ${record.id}">
        </span>
      </h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" th:href="@{/drivers/{id}/edit(id=${record.id})}">Modifier</a>
      <a th:href="@{/drivers}">Retour</a>
      <table>
        <tr>
          <th>Nom</th>
          <td th:text="${record.name != null ? record.name : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Téléphone</th>
          <td th:text="${record.phone != null ? record.phone : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Permis</th>
          <td th:text="${record.licenseNumber != null ? record.licenseNumber : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Validité permis</th>
          <td th:text="${record.licenseExpiry != null ? record.licenseExpiry : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Embauche</th>
          <td th:text="${record.hiredAt != null ? record.hiredAt : &#x27;—&#x27;}">
          </td>
        </tr>
        <tr>
          <th>Véhicule personnel</th>
          <td th:text="${vehicle != null ? vehicle.brand + ' ' + vehicle.model + ' · ' + vehicle.plate : '—'}">
          </td>
        </tr>
        <tr>
          <th>Statut</th>
          <td th:text="${record.status != null ? record.status : &#x27;—&#x27;}">
          </td>
        </tr>
      </table>
      <h2>Courses</h2>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Client</th>
            <th>Départ</th>
            <th>Destination</th>
            <th>Distance (km)</th>
            <th>Date et heure</th>
            <th>Passagers</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${rides}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.clientId}">
              </span>
            </td>
            <td>
              <span th:text="${row.departure}">
              </span>
            </td>
            <td>
              <span th:text="${row.destination}">
              </span>
            </td>
            <td>
              <span th:text="${row.distance}">
              </span>
            </td>
            <td>
              <span th:text="${row.scheduledAt}">
              </span>
            </td>
            <td>
              <span th:text="${row.passengers}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/rides/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(rides)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <h2>Historique</h2>
      <ul>
        <li th:each="e : ${audit}">
          <strong th:text="${e.action}">
          </strong>
          <span th:text="${e.actor + &#x27; · &#x27; + #temporals.format(e.occurredAt,&#x27;dd/MM/yyyy HH:mm&#x27;)}">
          </span>
        </li>
      </ul>
      <form sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;)" method="post" th:action="@{/drivers/{id}/delete(id=${record.id})}" onsubmit="return confirm(&#x27;Supprimer cet enregistrement ?&#x27;)">
        <button>Supprimer</button>
      </form>
    </main>
  </body>
</html>

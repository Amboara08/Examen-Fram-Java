<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Chauffeurs</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/drivers/new}">Ajouter</a>
      <form method="get">
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="EN_COURSE" th:selected="${status == &#x27;EN_COURSE&#x27;}">En course</option>
            <option value="DISPONIBLE" th:selected="${status == &#x27;DISPONIBLE&#x27;}">Disponible</option>
            <option value="EN_PAUSE" th:selected="${status == &#x27;EN_PAUSE&#x27;}">En pause</option>
            <option value="INDISPONIBLE" th:selected="${status == &#x27;INDISPONIBLE&#x27;}">Indisponible</option>
            <option value="SUSPENDU" th:selected="${status == &#x27;SUSPENDU&#x27;}">Suspendu</option>
          </select>
        </label>
        <label>
          Véhicule
          <select name="filter">
            <option value="">Tous</option>
            <option th:each="choice : ${vehicleIdChoices}" th:value="&#x27;vehicleId:&#x27; + ${choice.id}" th:selected="${filter == &#x27;vehicleId:&#x27; + choice.id}" th:text="${choice.plate}">
            </option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="name,asc">Nom</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/drivers}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Permis</th>
            <th>Validité permis</th>
            <th>Embauche</th>
            <th>Véhicule</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.name}">
              </span>
            </td>
            <td>
              <span th:text="${row.phone}">
              </span>
            </td>
            <td>
              <span th:text="${row.licenseNumber}">
              </span>
            </td>
            <td>
              <span th:text="${row.licenseExpiry}">
              </span>
            </td>
            <td>
              <span th:text="${row.hiredAt}">
              </span>
            </td>
            <td>
              <span th:text="${row.vehicleId}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/drivers/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/drivers(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/drivers(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>
